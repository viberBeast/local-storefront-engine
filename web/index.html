<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOREFRONT</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Keeps background static while allowing smooth isolated asset transitions */
    .raw-product-asset {
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-origin: center center;
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="camera-controls">
      <button onclick="toggleProductAssetZoom()" class="zoom-btn">+</button>
    </div>

    <nav class="center-nav">
      <button onclick="filterCatalog('ALL')" class="nav-link active" id="cat-ALL">ALL</button>
      <button onclick="filterCatalog('GARMENTS')" class="nav-link" id="cat-GARMENTS">GARMENTS</button>
      <button onclick="filterCatalog('FOOTWEAR')" class="nav-link" id="cat-FOOTWEAR">FOOTWEAR</button>
      <button onclick="filterCatalog('ACCESSORIES')" class="nav-link" id="cat-ACCESSORIES">ACCESSORIES</button>
    </nav>

    <div class="session-controls">
      <button onclick="toggleOverlayPanel('profile-panel')" class="nav-link">PROFILE</button>
      <button onclick="toggleOverlayPanel('bag-panel')" class="nav-link" id="bag-count-node">BAG (0)</button>
    </div>
  </header>

  <main id="canvas-container" onclick="resetViewToMap()">
    <div id="infinite-zoom-plane"></div>
  </main>

  <div id="product-focus-curtain" onclick="resetViewToMap()">
    <div class="focus-details-wrapper" onclick="event.stopPropagation()">
      <div class="focus-pane left">
        <h1 id="focus-item-name">—</h1>
        <p id="focus-item-price">—</p>
        <p id="focus-item-desc">—</p>
      </div>
      <div class="focus-pane right">
        <div class="size-selector-matrix">
          <span class="size-label">SELECT SIZE:</span>
          <div class="size-options">
            <button class="size-bubble" onclick="selectSize(this, '1')">1</button>
            <button class="size-bubble" onclick="selectSize(this, '2')">2</button>
            <button class="size-bubble" onclick="selectSize(this, '3')">3</button>
          </div>
        </div>
        <button id="focus-purchase-action" onclick="addFocusedItemToBag()">[ ADD TO BAG ]</button>
        <button class="close-focus-trigger" onclick="resetViewToMap()">[ CLOSE ]</button>
      </div>
    </div>
  </div>

  <div id="profile-panel" class="overlay-slide-panel">
    <div class="panel-header-row">
      <span>ACCOUNT SESSION</span>
      <button onclick="toggleOverlayPanel('profile-panel')" class="close-panel-btn">[ X ]</button>
    </div>
    <div class="panel-content-area">
      <p class="mono-subtext">COOKIE PERSPECTIVE STORAGE RECORD ACTIVE.</p>
      <div id="cookie-purchase-history">
         <p style="opacity:0.4; font-size:11px; margin-top:20px;">NO RECORDED COMPLETED RECENT SHIPMENTS FOUND IN SESSION.</p>
      </div>
    </div>
  </div>

  <div id="bag-panel" class="overlay-slide-panel">
    <div class="panel-header-row">
      <span>YOUR SELECTIONS</span>
      <button onclick="toggleOverlayPanel('bag-panel')" class="close-panel-btn">[ X ]</button>
    </div>
    <div class="panel-content-area">
      <div id="bag-items-list-container"></div>
      <div class="bag-footer-summary">
        <div class="total-row-line">
          <span>TOTAL:</span>
          <span id="bag-calculated-total">$0.00</span>
        </div>
        <button id="checkout-action-trigger" onclick="executeCheckoutSequence()">[ CONFIRM PURCHASE ]</button>
      </div>
    </div>
  </div>

  <div id="toast-notification">ADDED TO BAG</div>

  <script>
    let globalCatalog = [];
    let activeCategory = 'ALL';
    let isAssetZoomedActive = false;
    let selectedFocusedProductId = null;
    let selectedProductSize = null;
    let shoppingCart = [];

    window.addEventListener('DOMContentLoaded', () => {
      fetchCatalogPayload();
      loadCartSession();
    });

    function fetchCatalogPayload() {
      fetch('/api/products')
        .then(res => res.json())
        .then(data => {
          globalCatalog = data || [];
          renderZoomCanvas();
          evaluateUserCookiePerspective();
        });
    }

    function renderZoomCanvas() {
      const plane = document.getElementById('infinite-zoom-plane');
      plane.innerHTML = '';

      const dataset = globalCatalog.filter(p => activeCategory === 'ALL' || p.category === activeCategory);

      if(dataset.length === 0) {
        plane.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 100px 0; opacity:0.3; font-size:12px;">CATALOG FEED EMPTY</div>`;
        return;
      }

      dataset.forEach((prod) => {
        const itemNode = document.createElement('div');
        itemNode.className = `floating-product-node ${prod.stock === 0 ? 'sold-out-fade' : ''}`;
        
        itemNode.innerHTML = `
          <div class="asset-wrapper" onclick="triggerDeepFocus(event, '${prod.id}')" style="overflow: hidden;">
            <img src="${prod.image_url || '/static/placeholder.png'}" class="raw-product-asset" alt="Asset">
            ${prod.stock === 0 ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
          </div>
          <div class="product-metadata-label">
            <span class="meta-name">${prod.name}</span>
            <span class="meta-price">$${prod.price}</span>
          </div>
        `;
        plane.appendChild(itemNode);
      });
      applyIsolatedAssetTransformation();
    }

    function applyIsolatedAssetTransformation() {
      const assets = document.querySelectorAll('.raw-product-asset');
      assets.forEach(img => {
        if (isAssetZoomedActive) {
          img.style.transform = "scale(1.45)";
        } else {
          img.style.transform = "scale(1.0)";
        }
      });
    }

    function toggleProductAssetZoom() {
      isAssetZoomedActive = !isAssetZoomedActive;
      applyIsolatedAssetTransformation();
    }

    function triggerDeepFocus(event, id) {
      event.stopPropagation();
      const prod = globalCatalog.find(p => p.id === id);
      if(!prod) return;

      selectedFocusedProductId = id;
      selectedProductSize = null;
      document.querySelectorAll('.size-bubble').forEach(b => b.classList.remove('selected'));

      document.getElementById('focus-item-name').textContent = prod.name;
      document.getElementById('focus-item-price').textContent = `$${prod.price}`;
      document.getElementById('focus-item-desc').textContent = prod.description || 'NO ADDITIONAL INFORMATION PROVIDED.';
      
      const buyBtn = document.getElementById('focus-purchase-action');
      if(prod.stock === 0) {
        buyBtn.textContent = "[ SOLD OUT ]";
        buyBtn.disabled = true;
      } else {
        buyBtn.textContent = "[ ADD TO BAG ]";
        buyBtn.disabled = false;
      }

      document.getElementById('canvas-container').classList.add('blurred-focus');
      document.getElementById('product-focus-curtain').classList.add('activated');
    }

    function resetViewToMap() {
      selectedFocusedProductId = null;
      document.getElementById('canvas-container').classList.remove('blurred-focus');
      document.getElementById('product-focus-curtain').classList.remove('activated');
    }

    function filterCatalog(category) {
      activeCategory = category;
      document.querySelectorAll('.center-nav .nav-link').forEach(el => el.classList.remove('active'));
      document.getElementById(`cat-${category}`).classList.add('active');
      resetViewToMap();
      renderZoomCanvas();
    }

    function selectSize(element, size) {
      document.querySelectorAll('.size-bubble').forEach(b => b.classList.remove('selected'));
      element.classList.add('selected');
      selectedProductSize = size;
    }

    function addFocusedItemToBag() {
      if(!selectedFocusedProductId) return;
      const prod = globalCatalog.find(p => p.id === selectedFocusedProductId);
      if(!prod || prod.stock === 0) return;

      if(!selectedProductSize) {
        flashToast("SELECT A SIZE FIRST");
        return;
      }

      const cartItem = {
        product_id: prod.id,
        name: prod.name,
        price: prod.price,
        size: selectedProductSize,
        quantity: 1
      };

      shoppingCart.push(cartItem);
      saveCartSession();
      updateCartUINode();
      flashToast(`ADDED: ${prod.name} (SIZE ${selectedProductSize})`);
      resetViewToMap();
    }

    function toggleOverlayPanel(panelId) {
      const panel = document.getElementById(panelId);
      panel.classList.toggle('visible');
    }

    function loadCartSession() {
      const saved = localStorage.getItem('bag_session');
      if(saved) {
        shoppingCart = JSON.parse(saved);
        updateCartUINode();
      }
    }

    function saveCartSession() {
      localStorage.setItem('bag_session', JSON.stringify(shoppingCart));
    }

    function updateCartUINode() {
      document.getElementById('bag-count-node').textContent = `BAG (${shoppingCart.length})`;
      const container = document.getElementById('bag-items-list-container');
      container.innerHTML = '';

      let runningTotal = 0;
      shoppingCart.forEach((item, index) => {
        runningTotal += item.price;
        const row = document.createElement('div');
        row.className = 'bag-item-row';
        row.innerHTML = `
          <div>
            <div class="bag-item-title">${item.name}</div>
            <div class="bag-item-sub">SIZE: ${item.size} — $${item.price}</div>
          </div>
          <button onclick="removeBagItem(${index})" class="remove-bag-item-btn">[ REMOVE ]</button>
        `;
        container.appendChild(row);
      });

      document.getElementById('bag-calculated-total').textContent = `$${runningTotal}.00`;
    }

    function removeBagItem(index) {
      shoppingCart.splice(index, 1);
      saveCartSession();
      updateCartUINode();
    }

    function executeCheckoutSequence() {
      if(shoppingCart.length === 0) return;

      const payload = {
        items: shoppingCart.map(i => ({ product_id: i.product_id, quantity: 1 }))
      };

      fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => {
        if(!res.ok) return res.json().then(e => { throw new Error(e.error) });
        return res.json();
      })
      .then(order => {
        flashToast("ORDER SECURED COMPLETED");
        let history = JSON.parse(localStorage.getItem('order_history') || '[]');
        history.push(order.id);
        localStorage.setItem('order_history', JSON.stringify(history));
        
        shoppingCart = [];
        saveCartSession();
        updateCartUINode();
        toggleOverlayPanel('bag-panel');
        fetchCatalogPayload();
      })
      .catch(err => {
        alert("CHECKOUT ERROR: " + err.message);
      });
    }

    function evaluateUserCookiePerspective() {
      let history = JSON.parse(localStorage.getItem('order_history') || '[]');
      if(history.length > 0) {
        const target = document.getElementById('cookie-purchase-history');
        target.innerHTML = `<span class="mono-subtext">VERIFIED CUSTOMER ACQUISITIONS:</span>`;
        history.forEach(id => {
          target.innerHTML += `<div class="order-token-row">${id} <span style="color:#00ff00;">[SECURED]</span></div>`;
        });
      }
    }

    function flashToast(msg) {
      const toast = document.getElementById('toast-notification');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
