<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTROL TERMINAL</title>
  <style>
    :root { --font-mono: 'Courier New', Courier, monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
    body { background: #f9f9f9; color: #000000; font-family: var(--font-mono); text-transform: uppercase; font-size: 12px; padding: 40px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 2px solid #000; padding-bottom: 20px; }
    h1 { font-size: 16px; font-weight: normal; }
    .back-btn { text-decoration: none; color: #666; }

    .admin-grid-layout { display: grid; grid-template-columns: 350px 1fr; gap: 40px; }
    
    .control-blade { background: #ffffff; border: 1px solid #000000; padding: 30px; }
    .blade-title { font-weight: bold; margin-bottom: 20px; border-bottom: 1px solid #000; padding-bottom: 8px; }
    
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    .form-group label { font-size: 10px; color: #666; margin-bottom: 5px; }
    .form-group input, .form-group textarea, .form-group select { padding: 10px; font-family: var(--font-mono); font-size: 11px; border: 1px solid #ccc; background: #fff; }
    
    .action-submit-btn { width: 100%; background: #000; color: #fff; border: none; padding: 12px; font-family: var(--font-mono); font-size: 11px; cursor: pointer; }
    .action-submit-btn:hover { background: #333; }

    .tabs-row { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    .tab-trigger { background: transparent; border: none; font-family: var(--font-mono); cursor: pointer; color: #888; }
    .tab-trigger.active { color: #000; font-weight: bold; }
    
    .data-table-wrapper { background: #fff; border: 1px solid #000; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #eeeeee; font-size: 11px; }
    th { background: #fafafa; border-bottom: 1px solid #000; font-weight: normal; }
    
    .feed-item-preview-row { display: flex; align-items: center; gap: 15px; }
    .thumbnail-box { width: 40px; height: 40px; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; }
    .thumbnail-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    .status-pill { padding: 2px 6px; font-size: 10px; border: 1px solid #000; }
    .status-pending { background: #fff7e6; color: #d46b08; border-color: #ffd591; }
    .status-shipped { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
    
    .row-btn { background: transparent; border: none; font-family: var(--font-mono); font-size: 10px; cursor: pointer; text-decoration: underline; margin-right: 8px; }
    .danger-link { color: #ff0000; }
  </style>
</head>
<body>

  <header>
    <h1>OPERATIONAL CONTROL TERMINAL</h1>
    <a href="/" class="back-btn">[ ENTER STOREFRONT ]</a>
  </header>

  <div class="admin-grid-layout">
    
    <div class="control-blade">
      <div class="blade-title">PUBLISH NEW STREAM BLOCK</div>
      <form id="feed-publisher-form">
        <div class="form-group">
          <label>PRODUCT TRANSPARENT PNG ASSET PATH</label>
          <input type="text" id="prod-img" placeholder="e.g., /static/assets/pods.png" required>
        </div>
        <div class="form-group">
          <label>PRODUCT IDENTIFICATION TITLING</label>
          <input type="text" id="prod-name" placeholder="e.g., YEEZY PODS" required>
        </div>
        <div class="form-group">
          <label>PRICE VALUE (USD)</label>
          <input type="number" id="prod-price" placeholder="20" required min="0">
        </div>
        <div class="form-group">
          <label>INVENTORY INITIAL STOCK COUNT</label>
          <input type="number" id="prod-stock" placeholder="500" required min="0">
        </div>
        <div class="form-group">
          <label>STOREFRONT NAV CATEGORY LAYER</label>
          <select id="prod-category">
            <option value="GARMENTS">GARMENTS</option>
            <option value="FOOTWEAR">FOOTWEAR</option>
            <option value="ACCESSORIES">ACCESSORIES</option>
          </select>
        </div>
        <div class="form-group">
          <label>FEED SORTING SEQUENCE WEIGHT (LOWER RUNS FIRST)</label>
          <input type="number" id="prod-sort" value="0" required>
        </div>
        <div class="form-group">
          <label>PRODUCT SPECIFICATIONS / DESCRIPTIVE BLOCKS</label>
          <textarea id="prod-desc" rows="4" placeholder="ENTER CORE FABRIC DETAILS..."></textarea>
        </div>
        <button type="submit" class="action-submit-btn">[ COMMIT POST TO STREAM ]</button>
      </form>
    </div>

    <div class="management-workspace-container">
      <div class="tabs-row">
        <button onclick="switchTab('feed')" class="tab-trigger active" id="tab-btn-feed">LIVE CATALOG FEED</button>
        <button onclick="switchTab('orders')" class="tab-trigger" id="tab-btn-orders">INCOMING ORDER LOGISTICS</button>
      </div>

      <div id="view-zone-feed" class="data-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>FEED SEQUENCE</th>
              <th>PRODUCT CORE</th>
              <th>CATEGORY</th>
              <th>PRICE</th>
              <th>INVENTORY STOCK</th>
              <th>ACTIONS</th>
            </tr>
          </thead>
          <tbody id="catalog-rows-target">
          </tbody>
        </table>
      </div>

      <div id="view-zone-orders" class="data-table-wrapper" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>ORDER TOKEN</th>
              <th>ACQUISITION DATE</th>
              <th>ITEMS PARSED</th>
              <th>FINANCIAL VOLUME</th>
              <th>LOGISTICAL STATUS</th>
              <th>MARK FULFILLMENT</th>
            </tr>
          </thead>
          <tbody id="order-rows-target">
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    let activeWorkspaceTab = 'feed';

    window.addEventListener('DOMContentLoaded', () => {
      loadCatalogMatrix();
      loadLogisticsMatrix();
      document.getElementById('feed-publisher-form').addEventListener('submit', executePublishRequest);
    });

    function switchTab(targetTab) {
      activeWorkspaceTab = targetTab;
      document.querySelectorAll('.tab-trigger').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-btn-${targetTab}`).classList.add('active');

      if(targetTab === 'feed') {
        document.getElementById('view-zone-feed').style.display = 'block';
        document.getElementById('view-zone-orders').style.display = 'none';
        loadCatalogMatrix();
      } else {
        document.getElementById('view-zone-feed').style.display = 'none';
        document.getElementById('view-zone-orders').style.display = 'block';
        loadLogisticsMatrix();
      }
    }

    function loadCatalogMatrix() {
      fetch('/api/products')
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('catalog-rows-target');
          tbody.innerHTML = '';
          
          (data || []).forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>[SEQ: ${p.sort_order}]</td>
              <td>
                <div class="feed-item-preview-row">
                  <div class="thumbnail-box"><img src="${p.image_url || '/static/placeholder.png'}" alt=""></div>
                  <div><strong>${p.name}</strong><br><span style="font-size:10px; color:#666;">ID: ${p.id}</span></div>
                </div>
              </td>
              <td>${p.category}</td>
              <td>$${p.price}</td>
              <td>
                <input type="number" value="${p.stock}" style="width:60px; padding:4px; font-family:var(--font-mono);" 
                  onchange="updateStockInline('${p.id}', this.value)">
                ${p.stock === 0 ? '<span style="color:red; margin-left:5px;">[OUT]</span>' : ''}
              </td>
              <td>
                <button class="row-btn danger-link" onclick="deleteStreamPost('${p.id}')">[ DELETE ]</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        });
    }

    function executePublishRequest(e) {
      e.preventDefault();
      
      const payload = {
        name: document.getElementById('prod-name').value,
        image_url: document.getElementById('prod-img').value,
        price: parseInt(document.getElementById('prod-price').value),
        stock: parseInt(document.getElementById('prod-stock').value),
        category: document.getElementById('prod-category').value,
        sort_order: parseInt(document.getElementById('prod-sort').value),
        description: document.getElementById('prod-desc').value
      };

      fetch('/api/products/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(res => {
        if(res.ok) {
          document.getElementById('feed-publisher-form').reset();
          loadCatalogMatrix();
          alert("POST MOUNTED SECURELY TO TIMELINE STREAM");
        }
      });
    }

    function updateStockInline(id, newStock) {
      fetch('/api/products')
        .then(res => res.json())
        .then(catalog => {
          let item = (catalog || []).find(p => p.id === id);
          if(!item) return;

          item.stock = parseInt(newStock);
          fetch('/api/products/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(item)
          }).then(() => {
            loadCatalogMatrix();
          });
        });
    }

    function deleteStreamPost(id) {
      if(!confirm("CONFIRM REMOVAL FROM THE PUBLIC CANVAS STREAM?")) return;
      fetch(`/api/products/delete?id=${id}`, { method: 'DELETE' })
        .then(() => loadCatalogMatrix());
    }

    function loadLogisticsMatrix() {
      fetch('/api/orders')
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('order-rows-target');
          tbody.innerHTML = '';

          (data || []).forEach(o => {
            const itemsSummary = (o.items || []).map(i => `${i.product_name} x${i.quantity} ($${i.price})`).join('<br>');
            const tr = document.createElement('tr');
            
            const dateStr = o.created_at ? new Date(o.created_at).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'}) : '—';
            const statusClass = (o.status || 'Pending').toLowerCase() === 'shipped' ? 'status-shipped' : 'status-pending';

            tr.innerHTML = `
              <td><strong>${o.id}</strong></td>
              <td>${dateStr}</td>
              <td>${itemsSummary}</td>
              <td>$${o.total}.00</td>
              <td><span class="status-pill ${statusClass}">${o.status}</span></td>
              <td>
                ${o.status === 'Pending' ? 
                  `<button class="row-btn" onclick="mutateOrderStatus('${o.id}', 'Shipped')">[ MARK SHIPPED ]</button>` : 
                  `—`
                }
              </td>
            `;
            tbody.appendChild(tr);
          });
        });
    }

    function mutateOrderStatus(orderId, nextStatus) {
      fetch('/api/orders/update-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: orderId, status: nextStatus })
      }).then(() => loadLogisticsMatrix());
    }
  </script>
</body>
</html>
